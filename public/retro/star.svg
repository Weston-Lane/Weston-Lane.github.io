<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .spin { transform-origin: 50px 50px; animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
  <polygon class="spin"
    points="50,4 61,37 96,37 68,58 79,94 50,72 21,94 32,58 4,37 39,37"
    fill="#ff7a18" stroke="#2f6bff" stroke-width="5" stroke-linejoin="round"/>
</svg>
